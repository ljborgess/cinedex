{% extends 'catalogo/base.html' %}

{% block titulo %}Criar conta · Catálogo de Filmes{% endblock %}
{% block largura %}estreito{% endblock %}

{% block conteudo %}
<div class="cabeca">
    <h1>Criar conta</h1>
</div>

<form method="post" novalidate>
    {% csrf_token %}
    {% include 'usuarios/_campos.html' %}

    <div class="acoes" style="margin-top:38px;">
        <button type="submit" class="acao acao-forte">Criar conta</button>
        <a href="{% url 'login' %}" class="acao">Já tenho conta</a>
    </div>
</form>
{% endblock %}
